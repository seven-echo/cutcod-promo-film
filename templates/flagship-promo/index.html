<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>CutCod · 15 秒宣传模板</title>
    <link rel="icon" href="data:," />
    <script src="/node_modules/gsap/dist/gsap.min.js"></script>
    <style>
      :root {
        --ink: #171717;
        --muted: #77756f;
        --cream: #f7f7f7;
        --paper: #fff;
        --line: #e7e7e7;
        --yellow: #f1f32d;
        --en: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
        --zh: "PingFang SC", "Noto Sans SC", "Microsoft YaHei", sans-serif;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: #111; color: var(--ink); }
      body { display: flex; flex-direction: column; align-items: center; }
      #fit { flex: 1; width: 100%; display: grid; place-items: center; overflow: hidden; }
      #scaler { position: relative; }
      #stage {
        position: absolute;
        left: 0;
        top: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--cream);
        font-family: var(--zh);
      }
      .scene { position: absolute; inset: 0; overflow: hidden; visibility: hidden; }
      .kicker {
        font-family: var(--en);
        font-weight: 800;
        font-size: 13px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--muted);
      }
      .card { width: 246px; }
      .media {
        position: relative;
        height: 246px;
        border-radius: 20px;
        background: #232323;
        overflow: hidden;
      }
      .type-pill {
        position: absolute;
        top: 12px;
        left: 12px;
        z-index: 2;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        background: rgba(251, 250, 246, 0.88);
        border-radius: 999px;
        padding: 7px 9px;
        font-size: 11px;
        font-weight: 700;
      }
      .type-pill i { width: 7px; height: 7px; border-radius: 50%; background: #4c8dff; }
      .type-pill.prompt i { background: #9b61cf; }
      .type-pill.skill i { background: #f08d4e; }
      .duration {
        position: absolute;
        right: 11px;
        bottom: 10px;
        background: rgba(23, 23, 23, 0.7);
        color: #fff;
        padding: 4px 7px;
        border-radius: 7px;
        font-family: var(--en);
        font-size: 11px;
      }
      .ring, .lines, .skill-mark { position: absolute; }
      .ring {
        left: 50%;
        top: 50%;
        width: 92px;
        height: 92px;
        margin: -46px 0 0 -46px;
        border-radius: 50%;
        border: 10px solid #3a3a37;
        border-top-color: var(--yellow);
      }
      .lines { left: 28px; right: 28px; top: 78px; display: flex; flex-direction: column; gap: 12px; }
      .lines b { display: block; height: 12px; border-radius: 6px; background: #f3f3f0; }
      .lines b:nth-child(2) { width: 72%; background: var(--yellow); }
      .lines b:nth-child(3) { width: 48%; background: #5c5c58; }
      .skill-mark { left: 28px; right: 28px; top: 86px; height: 64px; border-radius: 14px; background: var(--yellow); }
      .card-meta { display: flex; align-items: center; gap: 9px; padding: 10px 5px 0; }
      .card-title { font-size: 14px; font-weight: 750; white-space: nowrap; }
      .card-author { margin-left: auto; font-size: 11px; color: #918e85; }
      .hl { position: relative; display: inline-block; }
      .hl i {
        position: absolute;
        left: -4px;
        right: -4px;
        top: 52%;
        height: 46%;
        background: var(--yellow);
        mix-blend-mode: multiply;
        transform-origin: 0 50%;
        z-index: -1;
        border-radius: 2px;
      }
      .word { display: inline-block; overflow: hidden; vertical-align: top; padding-bottom: 0.08em; }
      .word > span { display: inline-block; }
      .tabs { display: flex; gap: 10px; }
      .tab {
        height: 36px;
        padding: 0 16px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.7);
        color: var(--muted);
        font-size: 13px;
        font-weight: 700;
        display: inline-flex;
        align-items: center;
      }
      .tab.on { background: var(--yellow); color: var(--ink); }
      #hook .sentence, #line .sentence {
        position: absolute;
        left: 96px;
        top: 250px;
        width: 920px;
        font-size: 40px;
        font-weight: 600;
        line-height: 1.38;
      }
      #hook .card, #line .card { position: absolute; left: 1180px; top: 360px; }
      #show .tabs { position: absolute; left: 96px; top: 220px; }
      #show .row { position: absolute; left: 96px; top: 320px; display: flex; gap: 28px; }
      .modal {
        position: absolute;
        left: 360px;
        top: 230px;
        width: 980px;
        height: 520px;
        background: #fff;
        border-radius: 16px;
        box-shadow: 0 20px 70px rgba(0, 0, 0, 0.16);
        display: grid;
        grid-template-columns: 420px 1fr;
        overflow: hidden;
      }
      .modal-preview { display: grid; place-items: center; background: #fff; }
      .modal-info { padding: 36px 32px 0 8px; border-left: 1px solid var(--line); }
      .modal-info h2 { margin: 0 0 12px; font-size: 21px; font-weight: 650; letter-spacing: -0.025em; }
      .modal-info p { margin: 0 0 18px; font-size: 14px; line-height: 1.7; color: #6f6f6f; }
      .copy-label { display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: #777; margin-bottom: 8px; }
      .copy-btn { background: transparent; border: 0; color: #777; font: inherit; font-size: 12px; }
      .copy-btn.copied { color: #267a46; }
      .copy-block {
        height: 210px;
        overflow: hidden;
        background: #f3f3f3;
        border-radius: 12px;
        padding: 16px;
        font-size: 13px;
        line-height: 1.8;
        color: #262626;
      }
      .toast {
        position: absolute;
        left: 50%;
        bottom: 150px;
        transform: translateX(-50%);
        background: #1b1b1a;
        color: #fff;
        padding: 11px 16px;
        border-radius: 999px;
        font-size: 13px;
        opacity: 0;
        box-shadow: 0 12px 30px rgba(0, 0, 0, 0.22);
      }
      .band {
        position: absolute;
        left: 0;
        right: 0;
        top: 430px;
        height: 120px;
        background: var(--ink);
        color: #fff;
        display: flex;
        align-items: center;
        gap: 48px;
        padding-left: 96px;
        overflow: hidden;
        transform-origin: 50% 50%;
      }
      .band b { font-weight: 700; font-size: 40px; }
      #whip .sub { position: absolute; left: 96px; top: 580px; font-size: 14px; color: var(--muted); }
      .bento { position: absolute; left: 96px; top: 280px; display: grid; grid-template-columns: 360px 300px 360px; gap: 24px; }
      .box { background: #fff; border-radius: 16px; padding: 28px; box-shadow: 0 8px 26px rgba(23, 23, 23, 0.05); }
      .box h3 { margin: 0 0 18px; font-family: var(--en); font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
      .step { display: flex; align-items: center; gap: 12px; font-size: 16px; font-weight: 650; margin: 14px 0; }
      .dot { width: 22px; height: 22px; border-radius: 50%; background: var(--line); display: grid; place-items: center; font-size: 12px; font-weight: 800; }
      .num { font-family: var(--en); font-weight: 800; font-size: 64px; letter-spacing: -0.04em; line-height: 0.9; }
      .num .unit { font-size: 28px; }
      .stamp {
        margin-top: 28px;
        width: 88px;
        height: 88px;
        border-radius: 50%;
        background: var(--yellow);
        display: grid;
        place-items: center;
        font-weight: 800;
        font-size: 18px;
      }
      #outro { background: var(--yellow); }
      .brand { position: absolute; left: 96px; top: 420px; display: flex; align-items: center; gap: 20px; }
      .brand img { width: 72px; height: 72px; border-radius: 16px; background: #fff; object-fit: cover; }
      .letters { font-family: var(--en); font-weight: 800; font-size: 64px; letter-spacing: -0.04em; line-height: 1; }
      .letter { display: inline-block; overflow: hidden; height: 1.05em; }
      .letter > span { display: inline-block; }
      .url { position: absolute; left: 188px; top: 530px; font-family: var(--en); font-weight: 700; font-size: 18px; }
      body.render #bar { display: none; }
      #bar { height: 56px; display: flex; align-items: center; gap: 16px; padding: 0 18px; background: #1b1b1a; color: #fff; font: 600 14px var(--en); }
      #bar input { flex: 1; }
    </style>
  </head>
  <body>
    <div id="fit"><div id="scaler"><main id="stage"></main></div></div>
    <div id="bar">
      <span id="clock">0.00</span>
      <input id="scrub" type="range" min="0" max="15" step="0.01" value="0" />
      <button id="play" type="button">播放</button>
    </div>
    <script>
      const DURATION = 15;
      const T = { hook: 0, show: 2.35, pitch: 4.55, whip: 6.55, board: 8.15, line: 10.85, outro: 12.85, end: DURATION };
      const stage = document.getElementById('stage');
      if (new URLSearchParams(location.search).has('render')) document.body.classList.add('render');

      const el = (tag, className, text) => {
        const node = document.createElement(tag);
        if (className) node.className = className;
        if (text != null) node.textContent = text;
        return node;
      };
      const words = (parent, text) => [...text].map((ch) => {
        const wrap = el('span', 'word');
        wrap.append(el('span', null, ch === ' ' ? '\u00a0' : ch));
        parent.append(wrap);
        return wrap.firstChild;
      });
      const mark = (text) => {
        const hold = el('span', 'hl');
        const ink = el('i');
        hold.append(ink, el('span', null, text));
        return { hold, ink };
      };
      const card = (kind, name, time) => {
        const root = el('article', 'card');
        const media = el('div', 'media');
        const pill = el('span', 'type-pill' + (kind === '提示词' ? ' prompt' : kind === 'Skill' ? ' skill' : ''));
        pill.append(el('i'), document.createTextNode(kind));
        const art = kind === '源代码' ? el('i', 'ring') : kind === '提示词' ? el('span', 'lines') : el('i', 'skill-mark');
        if (kind === '提示词') art.append(el('b'), el('b'), el('b'));
        media.append(pill, art, el('span', 'duration', time));
        const meta = el('div', 'card-meta');
        meta.append(el('span', 'card-title', name), el('span', 'card-author', 'CutCod'));
        root.append(media, meta);
        return root;
      };

      const hook = el('section', 'scene');
      hook.id = 'hook';
      const hookSentence = el('div', 'sentence');
      const hookWords = words(hookSentence, '看到喜欢的，');
      const hookMark = mark('自己也能做');
      hookSentence.append(hookMark.hold);
      const hookCard = card('源代码', 'UI 形变', '0:15');
      hook.append(hookSentence, hookCard);

      const show = el('section', 'scene');
      show.id = 'show';
      const tabs = el('div', 'tabs');
      ['源代码', '提示词', 'Skill'].forEach((name, i) => tabs.append(el('span', 'tab' + (i === 0 ? ' on' : ''), name)));
      const row = el('div', 'row');
      const showCards = [card('源代码', 'UI 形变', '0:15'), card('提示词', '产品动画', '0:10'), card('Skill', '宣传片', '0:12')];
      row.append(...showCards);
      show.append(tabs, row);

      const pitch = el('section', 'scene');
      pitch.id = 'pitch';
      const modal = el('article', 'modal');
      const preview = el('div', 'modal-preview');
      preview.append(card('源代码', 'UI 形变', '0:15'));
      const info = el('div', 'modal-info');
      info.append(el('h2', null, 'UI 形变'));
      info.append(el('p', null, '整段复现说明在这里。点一下，直接带走。'));
      const copyLabel = el('div', 'copy-label');
      copyLabel.append(el('span', null, '复制到你常用的智能体即可使用'));
      const copyBtn = el('span', 'copy-btn', '复制');
      copyLabel.append(copyBtn);
      const block = el('div', 'copy-block', '作品：UI 形变\n先读取说明，按步骤运行，保留画面，接着改文案。');
      info.append(copyLabel, block);
      const toast = el('div', 'toast', '已复制，可以粘贴到 Codex 或 Claude');
      modal.append(preview, info);
      pitch.append(modal, toast);

      const whip = el('section', 'scene');
      whip.id = 'whip';
      const band = el('div', 'band');
      const whipWords = ['复制', '粘贴', '跑起来'].map((text) => el('b', null, text));
      band.append(...whipWords);
      whip.append(band, el('div', 'sub', '交给 Codex 或 Claude'));

      const board = el('section', 'scene');
      board.id = 'board';
      const bento = el('div', 'bento');
      const stepsBox = el('div', 'box');
      stepsBox.append(el('h3', null, 'Reproduce'));
      const steps = ['读取工程', '按说明运行', '接着改文案'].map((text) => {
        const line = el('div', 'step');
        const dot = el('div', 'dot', '');
        line.append(dot, el('span', null, text));
        stepsBox.append(line);
        return dot;
      });
      const countBox = el('div', 'box');
      countBox.append(el('h3', null, 'Less prompting'));
      const num = el('div', 'num');
      const numValue = el('span', null, '0');
      num.append(numValue, el('span', 'unit', '%'));
      countBox.append(num);
      const copyBox = el('div', 'box');
      copyBox.append(el('h3', null, 'Copied'), el('div', 'card-title', '已复制'));
      const stamp = el('div', 'stamp', '带走');
      copyBox.append(stamp);
      bento.append(stepsBox, countBox, copyBox);
      board.append(bento);

      const line = el('section', 'scene');
      line.id = 'line';
      const lineSentence = el('div', 'sentence');
      const lineWords = words(lineSentence, '看到喜欢的，');
      const lineMark = mark('自己也能做');
      lineSentence.append(lineMark.hold);
      const lineCard = card('源代码', 'UI 形变', '0:15');
      line.append(lineSentence, lineCard);

      const outro = el('section', 'scene');
      outro.id = 'outro';
      const brand = el('div', 'brand');
      const logo = el('img');
      logo.src = '/public/site/assets/cutcod-logo.jpg';
      logo.alt = '';
      const letters = el('div', 'letters');
      const letterInners = [...'CutCod'].map((ch) => {
        const wrap = el('span', 'letter');
        wrap.append(el('span', null, ch));
        letters.append(wrap);
        return wrap.firstChild;
      });
      brand.append(logo, letters);
      outro.append(brand, el('div', 'url', 'cutcod.com'));
      stage.append(hook, show, pitch, whip, board, line, outro);

      const scenes = [
        { node: hook, start: T.hook, end: T.show + 0.35 },
        { node: show, start: T.show, end: T.pitch + 0.35 },
        { node: pitch, start: T.pitch, end: T.whip + 0.35 },
        { node: whip, start: T.whip, end: T.board + 0.35 },
        { node: board, start: T.board, end: T.line + 0.35 },
        { node: line, start: T.line, end: T.outro + 0.35 },
        { node: outro, start: T.outro, end: T.end + 1 },
      ];
      const tl = gsap.timeline({ paused: true });
      const open = (node, at) => tl.fromTo(node, { clipPath: 'inset(0 100% 0 0)' }, { clipPath: 'inset(0 0% 0 0)', duration: 0.45, ease: 'power3.inOut' }, at);
      const rise = (nodes, at) => tl.fromTo(nodes, { yPercent: 110 }, { yPercent: 0, duration: 0.5, stagger: 0.035, ease: 'expo.out' }, at);
      const lineIn = (node, at) => tl.fromTo(node, { y: 16, opacity: 0 }, { y: 0, opacity: 1, duration: 0.45, ease: 'expo.out' }, at);

      lineIn(hookSentence, 0.12);
      tl.fromTo(hookMark.ink, { scaleX: 0 }, { scaleX: 1, duration: 0.4, ease: 'power3.out' }, 0.55);
      tl.fromTo(hookCard, { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: 'expo.out' }, 0.25);
      open(show, T.show);
      tl.fromTo(showCards, { y: 36, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, stagger: 0.08, ease: 'expo.out' }, T.show + 0.15);
      open(pitch, T.pitch);
      tl.to(copyBtn, { color: '#267a46', duration: 0.01 }, T.pitch + 0.7);
      tl.call(() => { copyBtn.textContent = '已复制'; copyBtn.classList.add('copied'); }, null, T.pitch + 0.7);
      tl.fromTo(toast, { y: 16, opacity: 0 }, { y: 0, opacity: 1, duration: 0.3, ease: 'expo.out' }, T.pitch + 0.85);
      tl.fromTo(band, { scaleY: 0 }, { scaleY: 1, duration: 0.25, ease: 'power3.inOut' }, T.whip);
      tl.fromTo(whipWords, { x: 240, opacity: 0 }, { x: 0, opacity: 1, duration: 0.4, stagger: 0.08, ease: 'power3.out' }, T.whip + 0.1);
      tl.fromTo([...bento.children], { y: 28, opacity: 0 }, { y: 0, opacity: 1, duration: 0.45, stagger: 0.08, ease: 'expo.out' }, T.board);
      tl.fromTo(stamp, { scale: 0.6, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.25, ease: 'expo.out' }, T.board + 1.1);
      open(line, T.line);
      lineIn(lineSentence, T.line + 0.12);
      tl.fromTo(lineMark.ink, { scaleX: 0 }, { scaleX: 1, duration: 0.4, ease: 'power3.out' }, T.line + 0.55);
      tl.fromTo(lineCard, { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.45, ease: 'expo.out' }, T.line + 0.2);
      tl.fromTo(logo, { scale: 0.86, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.35, ease: 'expo.out' }, T.outro);
      tl.fromTo(letterInners, { yPercent: 110 }, { yPercent: 0, duration: 0.4, stagger: 0.04, ease: 'expo.out' }, T.outro + 0.1);
      tl.fromTo(outro.querySelector('.url'), { y: 12, opacity: 0 }, { y: 0, opacity: 1, duration: 0.3, ease: 'expo.out' }, T.outro + 0.45);

      function paint(time) {
        const t = Math.min(DURATION, Math.max(0, time));
        if (t < T.pitch + 0.7) { copyBtn.textContent = '复制'; copyBtn.classList.remove('copied'); }
        tl.seek(t, false);
        for (const scene of scenes) scene.node.style.visibility = t >= scene.start && t < scene.end ? 'visible' : 'hidden';
        const u = Math.min(1, Math.max(0, (t - (T.board + 0.3)) / 0.7));
        numValue.textContent = String(Math.round((1 - (1 - u) ** 2) * 95));
        steps.forEach((dot, i) => {
          const on = t >= T.board + 0.4 + i * 0.18;
          dot.textContent = on ? '✓' : '';
          dot.style.background = on ? '#f1f32d' : '#e7e7e7';
        });
        const clock = document.getElementById('clock');
        const scrub = document.getElementById('scrub');
        if (clock) clock.textContent = t.toFixed(2);
        if (scrub && document.activeElement !== scrub) scrub.value = String(t);
      }

      let playing = false;
      let last = 0;
      const frame = (now) => {
        if (!playing) return;
        const dt = last ? (now - last) / 1000 : 0;
        last = now;
        const next = tl.time() + dt;
        if (next >= DURATION) { playing = false; paint(DURATION); return; }
        paint(next);
        requestAnimationFrame(frame);
      };
      window.seek = paint;
      window.playFilm = () => { playing = true; last = 0; requestAnimationFrame(frame); };
      const scaler = document.getElementById('scaler');
      const fit = () => {
        const renderMode = document.body.classList.contains('render');
        const scale = renderMode ? 1 : Math.min(window.innerWidth / 1920, (window.innerHeight - 56) / 1080);
        scaler.style.width = `${1920 * scale}px`;
        scaler.style.height = `${1080 * scale}px`;
        stage.style.transformOrigin = '0 0';
        stage.style.transform = `scale(${scale})`;
      };
      addEventListener('resize', fit);
      document.getElementById('scrub').addEventListener('input', (event) => { playing = false; paint(Number(event.target.value)); });
      document.getElementById('play').addEventListener('click', () => {
        if (tl.time() >= DURATION) paint(0);
        window.playFilm();
      });
      fit();
      paint(0);
    </script>
  </body>
</html>
