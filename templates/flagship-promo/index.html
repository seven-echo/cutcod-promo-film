<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>CutCod · 网站镜头</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/src/film.css" />
    <style>
      html, body { height: 100%; background: #111; }
      body { display: flex; flex-direction: column; }
      #fit { flex: 1; display: grid; place-items: center; overflow: hidden; }
      #scaler { position: relative; }
      #film-root { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; }
      body.render #bar { display: none; }
      #bar { height: 56px; display: flex; align-items: center; gap: 16px; padding: 0 18px; background: #1b1b1a; color: #fff; font: 600 14px "Segoe UI", sans-serif; }
      #bar input { flex: 1; }
    </style>
  </head>
  <body>
    <div id="fit">
      <div id="scaler"><div id="film-root"></div></div>
    </div>
    <div id="bar">
      <span id="clock">0.00</span>
      <input id="scrub" type="range" min="0" max="16" step="0.01" value="0" />
      <button id="play" type="button">播放</button>
    </div>
    <script type="module">
      const renderMode = new URLSearchParams(location.search).has('render');
      if (renderMode) document.body.classList.add('render');
      const scaler = document.getElementById('scaler');
      const stage = document.getElementById('film-root');
      const fit = () => {
        const scale = renderMode ? 1 : Math.min(window.innerWidth / 1920, (window.innerHeight - 56) / 1080);
        scaler.style.width = 1920 * scale + 'px';
        scaler.style.height = 1080 * scale + 'px';
        stage.style.transform = `scale(${scale})`;
      };
      addEventListener('resize', fit);
      fit();

      await import('/boot.js');
      const duration = window.TEMPLATE.duration;
      const scrub = document.getElementById('scrub');
      const clock = document.getElementById('clock');
      scrub.max = String(duration);
      const show = (t) => { clock.textContent = t.toFixed(2); if (document.activeElement !== scrub) scrub.value = String(t); };
      const filmSeek = window.seek;
      window.seek = async (t) => { await filmSeek(t); show(Math.min(duration, Math.max(0, Number(t) || 0))); };
      await window.__filmReady;
      show(0);

      let playing = false;
      let last = 0;
      const frame = async (now) => {
        if (!playing) return;
        const dt = last ? (now - last) / 1000 : 0;
        last = now;
        const next = Math.min(duration, Number(scrub.value) + dt);
        await window.seek(next);
        if (playing && next < duration) requestAnimationFrame(frame);
        else playing = false;
      };
      window.playFilm = () => { playing = true; last = 0; requestAnimationFrame(frame); };
      scrub.addEventListener('input', () => { playing = false; window.seek(Number(scrub.value)); });
      document.getElementById('play').addEventListener('click', () => {
        if (Number(scrub.value) >= duration) window.seek(0).then(() => window.playFilm());
        else window.playFilm();
      });
    </script>
  </body>
</html>
